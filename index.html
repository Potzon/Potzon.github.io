(function() {
  const faviconLink = document.getElementById('dynamic-favicon');
  if (!faviconLink) return;

  const staticHref = faviconLink.getAttribute('href') || 'favicon.svg';
  const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  const canvas = document.createElement('canvas');
  canvas.width = 32;
  canvas.height = 32;
  const ctx = canvas.getContext('2d');

  let radius = 3;
  let opacity = 0.9;
  let timerId = null;

  function updateRadarFavicon() {
    ctx.clearRect(0, 0, 32, 32);

    ctx.beginPath();
    ctx.arc(16, 16, radius, 0, 2 * Math.PI);
    ctx.strokeStyle = `rgba(255, 122, 87, ${opacity})`;
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(16, 16, 5, 0, 2 * Math.PI);
    ctx.fillStyle = '#FF7A57';
    ctx.fill();

    faviconLink.href = canvas.toDataURL('image/png');

    radius += 0.8;
    opacity -= 0.06;

    if (radius > 15) {
      radius = 3;
      opacity = 0.9;
    }
  }

  function stopFavicon() {
    if (timerId !== null) {
      clearInterval(timerId);
      timerId = null;
    }
    faviconLink.href = staticHref;
  }

  function syncFavicon() {
    if (motionQuery.matches || document.hidden) {
      stopFavicon();
    } else if (timerId === null) {
      updateRadarFavicon();
      timerId = setInterval(updateRadarFavicon, 70);
    }
  }

  document.addEventListener('visibilitychange', syncFavicon);
  if (motionQuery.addEventListener) motionQuery.addEventListener('change', syncFavicon);
  syncFavicon();
})();
