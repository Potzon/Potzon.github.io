services:
  web:
    build: .
    image: potzon-web:latest
    container_name: potzon-web
    ports:
      - "7000:80"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: potzon-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?define TUNNEL_TOKEN en .env}
    depends_on:
      - web
    restart: unless-stopped
