<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada · Gotzon Viteri</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#E8EDF1;--ink:#14202B;--mute:#53636F;--alert:#D9411E;--ria:#0E6B76}
@media (prefers-color-scheme:dark){:root{--bg:#0F1820;--ink:#E6EDF2;--mute:#9AABB8;--alert:#FF7A57;--ria:#4FC2CE}}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 'Helvetica Neue',Arial,sans-serif;padding:1.5rem;box-sizing:border-box}
main{max-width:34rem}
.code{display:flex;align-items:center;gap:.8rem;font:800 clamp(4rem,16vw,7rem)/1 'Helvetica Neue',Arial,sans-serif;letter-spacing:-.04em;margin:0}
.dot{width:.5em;height:.5em;border-radius:50%;border:.07em solid var(--alert);position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:22%;border-radius:50%;background:var(--alert)}
p{color:var(--mute);margin:1rem 0 1.6rem}
a{color:var(--ria);font-weight:600}
@media (prefers-reduced-motion:no-preference){.dot::after{animation:b 2.4s infinite ease-in-out}@keyframes b{50%{transform:scale(.7)}}}
</style>
</head>
<body>
<main>
  <h1 class="code">4<span class="dot" aria-hidden="true"></span>4</h1>
  <p>Anomalía detectada: esta página no existe o ha cambiado de sitio.<br>Page not found.</p>
  <a href="/">Volver al inicio · Back home</a>
</main>
</body>
</html>
