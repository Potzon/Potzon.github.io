server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    # Behind the Cloudflare tunnel nginx only sees http: redirects (e.g. /paperclaro -> /paperclaro/) must stay relative
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    # The app is rebuilt from a release tag: browsers must not mix an old app.js with a new index.html
    location /paperclaro/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location = /404.html {
        internal;
    }

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
}
